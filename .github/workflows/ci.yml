name: Herdr integration

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Live Herdr (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned Herdr release
        shell: bash
        env:
          HERDR_VERSION: '0.9.5'
          HERDR_SHA256: 14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d
        run: |
          bin_dir="$RUNNER_TEMP/herdr-bin"
          mkdir -p "$bin_dir"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/herdrdev/herdr/releases/download/v${HERDR_VERSION}/herdr-linux-x86_64" \
            --output "$bin_dir/herdr"
          printf '%s  %s\n' "$HERDR_SHA256" "$bin_dir/herdr" | sha256sum --check --strict
          chmod 0755 "$bin_dir/herdr"
          test "$("$bin_dir/herdr" --version)" = "herdr $HERDR_VERSION"
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"
      - name: Exercise the CLI against isolated Herdr instances
        shell: bash
        run: |
          command -v herdr
          herdr --version
          python3 -B tests/test_live.py -v
