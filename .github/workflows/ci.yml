name: Herdr integration

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Live Herdr (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.10', '3.12']
    env:
      HERDR_VERSION: '0.9.5'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned Herdr release (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          HERDR_SHA256: 14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d
        run: |
          bin_dir="$RUNNER_TEMP/herdr-bin"
          mkdir -p "$bin_dir"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/herdrdev/herdr/releases/download/v${HERDR_VERSION}/herdr-linux-x86_64" \
            --output "$bin_dir/herdr"
          printf '%s  %s\n' "$HERDR_SHA256" "$bin_dir/herdr" | sha256sum --check --strict
          chmod 0755 "$bin_dir/herdr"
          test "$("$bin_dir/herdr" --version)" = "herdr $HERDR_VERSION"
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"
      - name: Install pinned Herdr release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HERDR_SHA256: d2c6c9c971c43a0bfdde8c692a9a1a7a45c3e4807cd01ae45662b4734fac1cbf
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'herdr.zip'
          $binDir = Join-Path $env:RUNNER_TEMP 'herdr-bin'
          $url = "https://github.com/herdrdev/herdr/releases/download/v$env:HERDR_VERSION/herdr-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $env:HERDR_SHA256) {
            throw 'Unexpected Herdr release checksum'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $binDir
          $version = & (Join-Path $binDir 'herdr.exe') --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "herdr $env:HERDR_VERSION") {
            throw "Unexpected Herdr version: $version"
          }
          $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Exercise the CLI against isolated Herdr instances
        run: |
          herdr --version
          python -B -m unittest discover -s tests -v
